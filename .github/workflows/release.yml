name: Release

on:
  push:
    tags:
      - "v*"
  # Called by auto-release.yml: a tag pushed with GITHUB_TOKEN does not trigger
  # the push event above, so the tag name is passed in explicitly instead.
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0 # full history/tags, needed to diff against the previous tag below
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ env.TAG }}
        run: ./scripts/build.sh
      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## Changelog ($PREV_TAG...$TAG)"
              echo
              git log "$PREV_TAG..$TAG" --no-merges --pretty=format:'- %s (%h)'
              echo
              echo
              echo "**Full diff**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
            else
              echo "## Changelog"
              echo
              git log "$TAG" --no-merges --pretty=format:'- %s (%h)'
            fi
          } > CHANGELOG_RELEASE.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            build/sing_box_tray_runner.exe \
            --title "$TAG" \
            --notes-file CHANGELOG_RELEASE.md
